# Collect EVERY test directory by default.
#
# The suite was routinely invoked as `pytest h-mad/tests handoff/tests`, which
# silently excluded the 110 tests living in `handoff/scripts/` beside the scripts
# they pin. One of them (`test_orca_is_only_ever_reached_through_the_wrapper`) had
# been RED since 2026-08-31 and every "full suite passed" claim in that window --
# including a handoff doc's own closing verification -- was made without it.
#
# `testpaths` only applies when pytest is given no path arguments, so an explicit
# `pytest ~/.claude/skills/h-mad/tests/` install-path run is unaffected. The fix
# is therefore "a bare `pytest` sees everything", not a change to any run that
# names its own paths.
[pytest]
testpaths = h-mad/tests handoff/tests handoff/scripts
